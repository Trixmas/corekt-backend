spring.application.name=backend

# API Version Configuration
server.servlet.context-path=/api/v1

# Cors
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# Encryption (Required for EncryptionService)
encryption.master-key=${ENCRYPTION_MASTER_KEY}
encryption.rsa-private-key=${ENCRYPTION_RSA_PRIVATE_KEY}

# Mistral API
mistral.api.token=${MISTRAL_API_TOKEN}
mistral.agent.id=${MISTRAL_AGENT_ID}
mistral.agent.version=${MISTRAL_AGENT_VERSION:1}
spring.ai.mistralai.api-key=${SPRING_AI_MISTRALAI_API_KEY}

# JumpCloud LDAP
# ...
# (skipping middle part for brevity in thought, but I must provide full context in replace)

# JumpCloud LDAP
jumpcloud.ldap.url=${JUMPCLOUD_LDAP_URL}
jumpcloud.ldap.base=${JUMPCLOUD_LDAP_BASE}
jumpcloud.ldap.userdn=${JUMPCLOUD_LDAP_USERDN}
jumpcloud.ldap.password=${JUMPCLOUD_LDAP_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# 'validate' is safer for production to prevent accidental schema changes
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Disable Swagger in prod for security
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.root=INFO
logging.level.lab.corekt.backend=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.ldap=WARN

# Rate Limiting Configuration
ratelimit.requests=${RATELIMIT_REQUESTS:50}
ratelimit.duration-minutes=${RATELIMIT_DURATION_MINUTES:1}

# Taiga API
taiga.api.base-url=${TAIGA_API_BASE_URL:https://api.taiga.io/api/v1}
