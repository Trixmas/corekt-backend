services:
  postgres:
    image: postgres:latest
    container_name: postgres-container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: corekt
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d corekt" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corekt-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Database
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/corekt}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-admin}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      # Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # Encryption
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      ENCRYPTION_RSA_PRIVATE_KEY: ${ENCRYPTION_RSA_PRIVATE_KEY}
      # External APIs
      MISTRAL_API_TOKEN: ${MISTRAL_API_TOKEN}
      MISTRAL_ANALYSIS_AGENT_ID: ${MISTRAL_ANALYSIS_AGENT_ID}
      MISTRAL_PARSED_DATA_AGENT_ID: ${MISTRAL_PARSED_DATA_AGENT_ID}
      SPRING_AI_MISTRALAI_API_KEY: ${SPRING_AI_MISTRALAI_API_KEY}
      TAIGA_API_BASE_URL: ${TAIGA_API_BASE_URL:-https://api.taiga.io/api/v1}
      # LDAP
      JUMPCLOUD_LDAP_URL: ${JUMPCLOUD_LDAP_URL:-ldaps://ldap.jumpcloud.com:636}
      JUMPCLOUD_LDAP_BASE: ${JUMPCLOUD_LDAP_BASE}
      JUMPCLOUD_LDAP_USERDN: ${JUMPCLOUD_LDAP_USERDN}
      JUMPCLOUD_LDAP_PASSWORD: ${JUMPCLOUD_LDAP_PASSWORD}
      # Rate Limiting
      RATELIMIT_REQUESTS: ${RATELIMIT_REQUESTS:-50}
      RATELIMIT_DURATION_MINUTES: ${RATELIMIT_DURATION_MINUTES:-1}
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data: